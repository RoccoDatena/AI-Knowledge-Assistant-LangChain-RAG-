[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "A production-oriented document-grounded AI assistant."
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = "(^|/)(.venv|data)/"
explicit_package_bases = true
